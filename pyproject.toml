[project]
name = "llm-for-SLR"
version = "0.1.0"
description = "Deploying local LLMs for automated article screening in scientific literature reviews"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Ling-Hsuan Lao" },
    { name = "Hongruyu Chen" },
]
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.13.0",
    "kernels>=0.12.0,<0.13",
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "scikit-learn>=1.8.0",
    "torch>=2.11.0",
    "tqdm>=4.66.0",
    "transformers>=5.5.3",
]
